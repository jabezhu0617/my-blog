# PaperMod configuration.
# See https://github.com/adityatelange/hugo-PaperMod/wiki/ for full param docs.

baseURL = "http://localhost:1313/"
title = "Jabez Hu"
theme = "PaperMod"

enableRobotsTXT = true
enableEmoji = true

[services.rss]
  limit = 20            # was: rssLimit

[pagination]
  pagerSize = 5

# language support
defaultContentLanguage = "en"
[languages.en]
  locale = "en"
  label = "English"
  weight = 1

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

