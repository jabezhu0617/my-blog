[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 40
[[menu.main]]
  name = "Twitter"
  url = "https://x.com/asdbez"
  weight = 45
[[menu.main]]
  name = "GitHub"
  url = "https://github.com/jabezhu0617"
  weight = 50

[params]
  env = "production"
  author = "Jabez Hu"
  description = "Jabez Hu's Blog."   # TODO: write a real site description
  keywords = ["Hugo", "theme", "PaperMod"]
  DateFormat = "2006-01-02"      # was: dateFormatToUse

  defaultTheme = "auto"          # auto/light/dark
  disableThemeToggle = false

  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  ShowFullTextinRSS = true       # was: rssFullContent
  ShowToc = true                 # was: toc = true
  TocOpen = false
  UseHugoToc = true

  [params.label]
    text = "Jabez Hu"            # was: logoTitle

  [[params.socialIcons]]
    name = "email"
    url = "mailto:jabezhu0617@gmail.com"    
  [[params.socialIcons]]
    name = "twitter"
    url = "https://x.com/asdbez"    
  #[[params.socialIcons]]       # skip for now
    #name = "linkedin"
    #url = "http://localhost:1313"    
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/jabezhu0617"    

[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "monokai"
